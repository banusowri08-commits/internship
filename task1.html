<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Image Gallery</title>

<style>
/* ---------- GLOBAL STYLES ---------- */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
}

/* ---------- FILTER BUTTONS ---------- */
.filters {
    text-align: center;
    padding: 20px;
}

.filters button {
    padding: 10px 18px;
    margin: 5px;
    border: none;
    cursor: pointer;
    background: #333;
    color: #fff;
    border-radius: 5px;
    transition: background 0.3s;
}

.filters button:hover {
    background: #555;
}

/* ---------- GALLERY ---------- */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    padding: 20px;
}

.gallery-item {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    border-radius: 10px;
}

.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease, filter 0.4s ease;
}

.gallery-item:hover img {
    transform: scale(1.1);
    filter: brightness(80%);
}

/* ---------- LIGHTBOX ---------- */
.lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.lightbox img {
    max-width: 90%;
    max-height: 80%;
    border-radius: 10px;
}

.lightbox span {
    position: absolute;
    color: #fff;
    font-size: 35px;
    cursor: pointer;
    user-select: none;
}

.close {
    top: 20px;
    right: 30px;
}

.prev {
    left: 30px;
}

.next {
    right: 30px;
}

/* ---------- RESPONSIVE ---------- */
@media (max-width: 600px) {
    .lightbox span {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<!-- FILTER BUTTONS -->
<div class="filters">
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('city')">City</button>
    <button onclick="filterImages('animals')">Animals</button>
</div>

<!-- IMAGE GALLERY -->
<div class="gallery">
    <div class="gallery-item nature"><img src="https://picsum.photos/id/1018/600/400"></div>
    <div class="gallery-item city"><img src="https://picsum.photos/id/1015/600/400"></div>
    <div class="gallery-item animals"><img src="https://picsum.photos/id/1024/600/400"></div>
    <div class="gallery-item nature"><img src="https://picsum.photos/id/1016/600/400"></div>
    <div class="gallery-item city"><img src="https://picsum.photos/id/1031/600/400"></div>
    <div class="gallery-item animals"><img src="https://picsum.photos/id/1025/600/400"></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <span class="close" onclick="closeLightbox()">×</span>
    <span class="prev" onclick="changeImage(-1)">❮</span>
    <img id="lightbox-img">
    <span class="next" onclick="changeImage(1)">❯</span>
</div>

<script>
let currentIndex = 0;
const images = document.querySelectorAll(".gallery-item img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

/* ---------- OPEN LIGHTBOX ---------- */
images.forEach((img, index) => {
    img.addEventListener("click", () => {
        currentIndex = index;
        lightboxImg.src = img.src;
        lightbox.style.display = "flex";
    });
});

/* ---------- CLOSE LIGHTBOX ---------- */
function closeLightbox() {
    lightbox.style.display = "none";
}

/* ---------- NEXT / PREV ---------- */
function changeImage(step) {
    currentIndex += step;

    if (currentIndex < 0) {
        currentIndex = images.length - 1;
    }
    if (currentIndex >= images.length) {
        currentIndex = 0;
    }
    lightboxImg.src = images[currentIndex].src;
}

/* ---------- FILTER IMAGES ---------- */
function filterImages(category) {
    const items = document.querySelectorAll(".gallery-item");
    items.forEach(item => {
        if (category === "all" || item.classList.contains(category)) {
            item.style.display = "block";
        } else {
            item.style.display = "none";
        }
    });
}
</script>

</body>
</html>
